<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bruno Jesus - CV</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-theme="light">
  <button class="toggle" onclick="toggleTheme()">🌙 Switch to Dark Mode</button>

  <img class="picture" src="assets/picture.jpeg" alt="Bruno Jesus">
  <h1>&lt;BRUNO&nbsp;JESUS&gt;</h1>
  <p>
    Experienced Software Developer with expertise in Go, Java, and Kubernetes.<br>
    Proven track record in developing scalable solutions for e-commerce, automotive,
    insurance, and healthcare industries.
  </p>

  <div class="button-container">
    <a href="assets/cv.pdf" download class="cv">
      <img src="assets/svg/file.svg" alt="LinkedIn"
        style="width: 20px; height: 20px; filter: brightness(0) invert(1);">
      Download CV
    </a>

    <a href="https://github.com/brunofjesus" class="github" target="_blank">
      <img src="assets/svg/github.svg" alt="LinkedIn"
        style="width: 20px; height: 20px; filter: brightness(0) invert(1);">
      GitHub
    </a>

    <a href="https://www.linkedin.com/in/bruno-jesus-0ab943a9" class="linkedin" target="_blank">
      <img src="assets/svg/linkedin.svg" alt="LinkedIn"
        style="width: 20px; height: 20px; filter: brightness(0) invert(1);">
      LinkedIn
    </a>
  </div>

  <script>
    function getSystemTheme() {
      return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }

    function updateTheme(theme) {
      const body = document.body;
      const button = document.querySelector('.toggle');

      body.setAttribute('data-theme', theme);
      button.textContent = theme === 'light' ? '🌙 Switch to Dark Mode' : '☀️ Switch to Light Mode';
    }

    function toggleTheme() {
      const body = document.body;
      const current = body.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      updateTheme(next);
    }

    // Listen for system theme changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      updateTheme(e.matches ? 'dark' : 'light');
    });

    // Initialize theme on page load
    document.addEventListener('DOMContentLoaded', () => {
      updateTheme(getSystemTheme());
    });
  </script>
</body>

</html>
