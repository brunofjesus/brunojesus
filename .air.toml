root = "."
tmp_dir = "tmp"

[build]
  pre_cmd = ["go tool templ generate"]
  cmd = "go build -o ./tmp/main ."
  entrypoint = ["./tmp/main"]
  include_ext = ["go", "templ"]
  exclude_dir = ["tmp", "vendor", "testdata"]
  exclude_regex = ["_test.go", "_templ.go"]
  send_interrupt = true
  kill_delay = "500ms"
  delay = 300

[log]
  time = true

[screen]
  clear_on_rebuild = false
